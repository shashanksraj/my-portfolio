<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
  <title>Text tokens becoming feature vectors and an evaluation matrix</title>
  <rect width="800" height="600" fill="#EDEBE4"/>

  <!-- tokenized text -->
  <g fill="#F7F5F0" stroke="#C4C0B5" stroke-width="2">
    <rect x="44" y="204" width="76" height="26" rx="13"/>
    <rect x="130" y="204" width="76" height="26" rx="13"/>
    <rect x="44" y="244" width="110" height="26" rx="13"/>
    <rect x="164" y="244" width="52" height="26" rx="13"/>
    <rect x="44" y="284" width="56" height="26" rx="13"/>
    <rect x="110" y="284" width="82" height="26" rx="13" fill="#C9D3EC" stroke="#4263B8"/>
    <rect x="44" y="324" width="96" height="26" rx="13"/>
    <rect x="150" y="324" width="58" height="26" rx="13"/>
    <rect x="44" y="364" width="70" height="26" rx="13"/>
    <rect x="124" y="364" width="64" height="26" rx="13"/>
  </g>

  <!-- arrow 1 -->
  <path d="M232 297 H270 M260 287 L272 297 L260 307" stroke="#4263B8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- feature vector grid -->
  <g>
    <!-- 6 x 6 cells of 28px with 6px gaps, origin (294, 198) -->
    <rect x="294" y="198" width="28" height="28" fill="#F7F5F0"/>
    <rect x="328" y="198" width="28" height="28" fill="#C9D3EC"/>
    <rect x="362" y="198" width="28" height="28" fill="#F7F5F0"/>
    <rect x="396" y="198" width="28" height="28" fill="#8FA3D6"/>
    <rect x="430" y="198" width="28" height="28" fill="#F7F5F0"/>
    <rect x="464" y="198" width="28" height="28" fill="#DDE3F2"/>

    <rect x="294" y="232" width="28" height="28" fill="#DDE3F2"/>
    <rect x="328" y="232" width="28" height="28" fill="#F7F5F0"/>
    <rect x="362" y="232" width="28" height="28" fill="#4263B8"/>
    <rect x="396" y="232" width="28" height="28" fill="#F7F5F0"/>
    <rect x="430" y="232" width="28" height="28" fill="#C9D3EC"/>
    <rect x="464" y="232" width="28" height="28" fill="#F7F5F0"/>

    <rect x="294" y="266" width="28" height="28" fill="#F7F5F0"/>
    <rect x="328" y="266" width="28" height="28" fill="#8FA3D6"/>
    <rect x="362" y="266" width="28" height="28" fill="#DDE3F2"/>
    <rect x="396" y="266" width="28" height="28" fill="#F7F5F0"/>
    <rect x="430" y="266" width="28" height="28" fill="#4263B8"/>
    <rect x="464" y="266" width="28" height="28" fill="#DDE3F2"/>

    <rect x="294" y="300" width="28" height="28" fill="#C9D3EC"/>
    <rect x="328" y="300" width="28" height="28" fill="#F7F5F0"/>
    <rect x="362" y="300" width="28" height="28" fill="#F7F5F0"/>
    <rect x="396" y="300" width="28" height="28" fill="#C9D3EC"/>
    <rect x="430" y="300" width="28" height="28" fill="#F7F5F0"/>
    <rect x="464" y="300" width="28" height="28" fill="#8FA3D6"/>

    <rect x="294" y="334" width="28" height="28" fill="#F7F5F0"/>
    <rect x="328" y="334" width="28" height="28" fill="#DDE3F2"/>
    <rect x="362" y="334" width="28" height="28" fill="#8FA3D6"/>
    <rect x="396" y="334" width="28" height="28" fill="#F7F5F0"/>
    <rect x="430" y="334" width="28" height="28" fill="#DDE3F2"/>
    <rect x="464" y="334" width="28" height="28" fill="#F7F5F0"/>

    <rect x="294" y="368" width="28" height="28" fill="#4263B8"/>
    <rect x="328" y="368" width="28" height="28" fill="#F7F5F0"/>
    <rect x="362" y="368" width="28" height="28" fill="#C9D3EC"/>
    <rect x="396" y="368" width="28" height="28" fill="#DDE3F2"/>
    <rect x="430" y="368" width="28" height="28" fill="#F7F5F0"/>
    <rect x="464" y="368" width="28" height="28" fill="#C9D3EC"/>
  </g>
  <rect x="293" y="197" width="200" height="200" fill="none" stroke="#C4C0B5" stroke-width="2"/>

  <!-- arrow 2 -->
  <path d="M516 297 H554 M544 287 L556 297 L544 307" stroke="#4263B8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- evaluation matrix -->
  <rect x="580" y="208" width="82" height="82" fill="#4263B8"/>
  <rect x="670" y="208" width="82" height="82" fill="#DAD7CF"/>
  <rect x="580" y="298" width="82" height="82" fill="#DAD7CF"/>
  <rect x="670" y="298" width="82" height="82" fill="#8FA3D6"/>

  <!-- stage labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#55534E" text-anchor="middle">
    <text x="126" y="462">TEXT</text>
    <text x="393" y="462">FEATURES</text>
    <text x="666" y="462">EVALUATION</text>
  </g>
</svg>
